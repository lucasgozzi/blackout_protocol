name: blackout_protocol
description: A cooperative strategy game based on Zombicide mechanics.
publish_to: 'none'
version: 0.1.1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Game engine
  flame: ^1.18.0
  flame_tiled: ^1.18.0        # Tiled map support (tile-based maps as data)

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Data / serialization
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

  # Utilities
  equatable: ^2.0.5
  uuid: ^4.4.2
  shared_preferences: ^2.3.2
  go_router: ^14.2.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.11
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/campaigns/
    - assets/data/campaigns/tutorial/
    - assets/data/campaigns/campaign_01/
    - assets/data/enemies/
    - assets/data/players/
    - assets/data/loot/
    - assets/data/weapons/
    - assets/data/maps/
    - assets/maps/
    - assets/sprites/
    - assets/sprites/tiles/
    - assets/sprites/characters/
    - assets/sprites/enemies/
    - assets/sprites/weapons/
